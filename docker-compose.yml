services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: narion
      POSTGRES_USER: narion
      POSTGRES_PASSWORD: narion
    ports:
      - "5432:5432"
    volumes:
      - narion_pgdata:/var/lib/postgresql/data

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://narion:narion@db:5432/narion
      SECRET_KEY: dev-secret-key
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      - db

volumes:
  narion_pgdata:
